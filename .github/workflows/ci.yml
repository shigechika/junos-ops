name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned, not floating: a ruff release that adds a rule to its default
      # set would otherwise turn this gate red on a commit that changed
      # nothing. Bumping it is then a deliberate PR with the new findings
      # visible in the diff.
      - name: Install ruff
        run: pip install ruff==0.16.0

      # check only — see ruff.toml for why `ruff format` is not gated here.
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test dependencies
        run: pip install -e ".[test]"

      - name: Syntax check
        run: python3 -c "import junos_ops.cli"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Build package
        run: pip install build && python -m build
